# Desktop access control must replace the upstream webserver row before any
# route-owning plugin is activated. The replacement keeps the public service
# name `webServer` while wrapping every registration boundary.
- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  disabled: true

- insert:
    - id: desktop-webserver
      name: dsh-desktop-host/webserver
      config:
        host: 127.0.0.1
        port: !!js Number(process.env.DSH_DESKTOP_PORT ?? 3080)

# The row below is also the web client plugin. Its node half starts the
# inherited control channel; its browser half is served through ./client.
- insert:
    - id: desktop-host
      name: dsh-desktop-host

# Runtime 0.1.7 adds the account launcher for Desktop hosts, and this shell can
# now serve the whole flow: the client half registers only where
# `window.dshDesktop` exists (the shell injects it), the authorization provider
# registers `/oauth/callback` on the host web server we wrap, and the access
# fence admits exactly that callback shape so the browser can come back from
# the Platform. The launcher replaces the ordinary Settings button in the
# sidebar footer, which is the upstream Desktop arrangement.
- id: ui-settings-account
  disabled: false

# The upstream Desktop-only default checks for a Profile literally named
# `desktop`; this app's isolated manifest is `dsh-profile-swift-desktop`, so the
# provider would otherwise report `x-client-platform: web`. This bundle is
# installed only in the App's own Profile, so the platform is the whole
# condition here. Keep the built-in Browser enabled as well, so chat links can
# use the right sidebar.
- id: ui-sidebar-browser
  disabled: false

- id: deepseek-account
  config:
    desktopPlatform: !!js "['darwin', 'win32'].includes(process.platform) ? process.platform : null"
